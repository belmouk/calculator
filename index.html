<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <meta name="description" content="Calculator that helps with basic math operations">
</head>

<body>
    <div id="calculator-container">

        <div id="calculator-outputs">
            <div id="expression" class="outputs">Expression</div>
            <div id="result" class="outputs">Result</div>
        </div>

        <div id="calculator-inputs">

            <div id="numbers-container">
                <button id="1" class="numbers" type="button">0</button>
                <button id="2" class="numbers" type="button">1</button>
                <button id="3" class="numbers" type="button">2</button>
                <button id="4" class="numbers" type="button">3</button>
                <button id="5" class="numbers" type="button">4</button>
                <button id="6" class="numbers" type="button">5</button>
                <button id="7" class="numbers" type="button">6</button>
                <button id="8" class="numbers" type="button">7</button>
                <button id="9" class="numbers" type="button">8</button>
                <button id="0" class="numbers" type="button">9</button>
            </div>
            <div id="operators-container">
                <button id="+" class="operators" type="button">+</button>
                <button id="-" class="operators" type="button">-</button>
                <button id="/" class="operators" type="button">/</button>
                <button id="*" class="operators" type="button">*</button>
                <button id="*" class="operators" type="button">=</button>
            </div>
        </div>

    </div>

</body>

</html>
