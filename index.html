<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <meta name="description" content="Calculator that helps with basic math operations">
</head>

<body>
    <h1>Calculator</h1>
    <div id="calculator-container">

        <div id="calculator-outputs">
            <div id="expression" class="outputs"></div>
            <div id="result" class="outputs"></div>
        </div>

        <div id="calculator-inputs">
            <div class="row1">
                <button id="CE" type="button">CE</button>
                <button id="AC" type="button">AC</button>
                <button id="multiply" type="button">*</button>
            </div>
            <div class=" row2">
                <button type="button">1</button>
                <button type="button">2</button>
                <button type="button">3</button>
                <button type="button">+</button>
            </div>
            <div class="row3">
                <button type="button">4</button>
                <button type="button">5</button>
                <button type="button">6</button>
                <button type="button">-</button>

            </div>
            <div class="row4">
                <button type="button">7</button>
                <button type="button">8</button>
                <button type="button">9</button>
                <button type="button">/</button>

            </div>
            <div class="row5">
                <button id="zero" type="button">0</button>
                <button type="button">.</button>
                <button type="button">=</button>

            </div>


        </div>
    </div>


</body>

</html>
